[package]
name = "sigh_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "macros"] }
tokio = { version = "1.54.0", features = ["full"] }
tiberius = { version = "0.12", features = ["tokio"] } # <-- Solo con tokio, evitando conflictos TLS múltiples
bb8 = "0.8"
bb8-tiberius = "0.1"
serde_json = "1.0"
tokio-util = { version = "0.7", features = ["compat"] }
tower-http = { version = "0.6", features = ["cors"] }